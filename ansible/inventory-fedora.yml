---
all:
  hosts:
    inferno-node:
      # VM 110: COPILOT-FEDORA-IOT-TEST-03, PRX-01, Fedora IoT 42
      # SSH: ssh -i ~/.ssh/inferno_proxmox core@10.10.1.79
      ansible_host: 10.10.1.79
      ansible_user: "{{ inferno_user }}"
      ansible_ssh_private_key_file: "~/.ssh/inferno_proxmox"
      ansible_become_password: "inferno123"

  vars:
    inferno_user: core
    # inferno_home differs from Arch — Fedora IoT places /home under /var/home/
    inferno_home: /var/home/core
    inferno_interface: ens18
    inferno_hostname: fedora-iot
    inferno_name: "Fedora-IoT"
    dante_device_ip: 192.168.1.34

    # Binary / plugin paths — all under /var/lib/inferno/ to survive ostree updates
    inferno_plugin_dir: /var/lib/inferno/alsa-plugins
    inferno_plugin_path: /var/lib/inferno/alsa-plugins/libasound_module_pcm_inferno.so
    inferno_bin_dir: /var/lib/inferno/bin
    statime_bin: /var/lib/inferno/bin/statime
    statime_config: /etc/inferno/inferno-ptpv1.toml
    librespot_bin: /var/home/core/.cargo/bin/librespot

    # inferno_device_id is auto-derived from inferno_interface MAC in site-fedora.yml pre_tasks
