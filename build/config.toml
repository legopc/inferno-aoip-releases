# bootc-image-builder configuration
#
# Do NOT add [[customizations.user]] here.
# The 'core' user, password, and sudoers are baked into the container image
# via the Containerfile. Adding a user section with a 'key' field causes Anaconda
# to call set_user_ssh_key BEFORE the bootc image is deployed → fail.
#
# The BIB-generated kickstart is complete without a user section.
# If Anaconda shows "kickstart insufficient", the real fix is using --vga std
# (not --vga serial0) so Anaconda can render its TUI.
#
# See: https://github.com/osbuild/bootc-image-builder#-configuration-file

# Boot timeout for the installer (seconds).
# 0 = wait forever (default); 3 = auto-proceed after 3 s on headless nodes.
[customizations.installer]
  timeout = 3
