# Inferno AoIP appliance — snmpd configuration
# Managed by inferno-configure.sh; community string set at provisioning time.
# Read-only SNMPv2c for Cisco NMS integration.

# Listen on UDP 161, all interfaces
agentaddress udp:161

# Community: read-only (replace %%SNMP_COMMUNITY%% at firstboot)
rocommunity %%SNMP_COMMUNITY%% default

# System identity
syslocation "Het Vliegende Paard, Zwolle, NL"
syscontact  "Inferno AoIP Appliance <noc@vliegendepaard.nl>"

# Disable unwanted default views
view   systemonly  included   .1.3.6.1.2.1.1      # system group
view   systemonly  included   .1.3.6.1.2.1.2      # interfaces
view   systemonly  included   .1.3.6.1.2.1.25     # HOST-RESOURCES-MIB
view   systemonly  included   .1.3.6.1.4.1.99999  # Inferno private arc

# AgentX socket for subagent
master agentx
agentxsocket /var/agentx/master
agentxperms 0666 0666

# Extend sysDescr with appliance version
extend  sysDescr  /usr/local/sbin/inferno-snmp-sysDescr.sh
