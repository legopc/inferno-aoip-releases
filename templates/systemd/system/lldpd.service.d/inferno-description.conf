[Service]
# Write /etc/lldpd.conf from /etc/inferno.conf before lldpd starts.
# This runs on every boot so upgrades (which skip inferno-configure.sh) also get
# the correct Virgil-AoIP-Appliance description.
ExecStartPre=/bin/bash -c 'source /etc/inferno.conf 2>/dev/null && [ -n "${INFERNO_NAME}" ] && printf "configure system description \"Virgil-AoIP-Appliance %s\"\n" "${INFERNO_NAME}" > /etc/lldpd.conf || true'
