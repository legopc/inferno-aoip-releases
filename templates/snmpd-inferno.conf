# snmpd.conf — Inferno AoIP appliance SNMP configuration
#
# SNMPv2c read-only community. Restrict to your NMS subnet in production.
# Replace "inferno_ro" with your actual community string.
#
# IMPORTANT: Change the community string from the default before deployment!
# Item 26 (default password) — same principle applies here.

# ── Community strings ──────────────────────────────────────────────────────────
# Read-only community for NMS polling
# Restrict to your Cisco NMS IP (replace 10.10.1.0/24 with actual NMS subnet):
rocommunity inferno_ro 10.10.1.0/24

# ── AgentX ────────────────────────────────────────────────────────────────────
# Enable AgentX master so inferno-snmp-agent.py (subagent) can connect
master agentx
agentXSocket /var/agentx/master
agentXPerms 0660 0660 root root

# ── System info ───────────────────────────────────────────────────────────────
# Override with site-specific values at deployment:
sysContact  infra@hetvliegendepaard.nl
sysLocation "Het Vliegende Paard — Zwolle, NL"
sysName     inferno-appliance

# ── Security: disable non-essential features ──────────────────────────────────
# Read-only polling only — no SNMPv3, no write access, no traps
# HOST-RESOURCES-MIB and IF-MIB are handled natively by snmpd

# ── Logging ───────────────────────────────────────────────────────────────────
doNotLogTraps yes
