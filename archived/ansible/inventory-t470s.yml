---
all:
  hosts:
    inferno-node:
      # ThinkPad T470s — BT project node, 192.168.1.45
      # Base Inferno stack in spotify mode; Bluetooth additions come later.
      ansible_host: 192.168.1.45
      ansible_user: legopc
      ansible_password: "312858"
      ansible_become_password: "312858"
      ansible_connection: paramiko
      ansible_python_interpreter: /usr/bin/python3
      ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

      inferno_user: legopc
      inferno_interface: enp0s31f6
      inferno_name: "T470s-BT"
      inferno_mode: spotify

      # ALC298 audio codec (ThinkPad T470s).
      # snd-aloop is pinned to card 5 by the base role; hardware card lands at 0.
      inferno_audio_card: 0

      # DEVICE_ID derived from ethernet MAC 54:e1:ad:6a:8b:33 → strip colons + pad to 16 hex
      # Auto-derivation in site.yml pre_tasks will produce the same value; set here for clarity.
      inferno_device_id: "54e1ad6a8b330000"
